name: iOS build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Localization check (every key has Arabic)
        run: python3 -I l10n/build_strings.py

      - name: WatchCore unit tests (protocol encoders/decoders)
        working-directory: ios/Packages/WatchCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and test app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sawar.xcodeproj -scheme Sawar \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      # Unsigned: the user signs it on Windows (e.g. Sideloadly with their Apple ID) to install it.
      - name: Build unsigned IPA (iPhone, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Sawar.xcodeproj -scheme Sawar -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee -a xcodebuild.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sawar.app Payload/
          zip -qry Sawar-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sawar-unsigned-ipa
          path: ios/Sawar-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
